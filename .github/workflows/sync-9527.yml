name: sync-9527-prices

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync-9527.mjs'
      - '.github/workflows/sync-9527.yml'

permissions:
  contents: write

concurrency:
  group: sync-9527-prices
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch 9527CODE pricing
        run: node scripts/sync-9527.mjs

      - name: Validate data
        run: node scripts/validate.mjs

      - name: Commit price changes
        shell: bash
        run: |
          if git diff --quiet -- data/providers/9527code.json; then
            echo 'No 9527CODE price changes.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/providers/9527code.json
          git commit -m 'chore(data): sync 9527CODE prices'
          git pull --rebase
          git push
