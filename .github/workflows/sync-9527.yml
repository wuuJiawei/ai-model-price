name: sync-9527-prices

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync-9527.mjs'
      - '.github/workflows/sync-9527.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-9527-prices
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch 9527CODE pricing
        run: node scripts/sync-9527.mjs

      - name: Validate data
        run: node scripts/validate.mjs

      - name: Commit latest sync snapshot
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- data/providers/9527code.json; then
            echo 'No 9527CODE data changes.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/providers/9527code.json
          git commit -m 'chore(data): sync 9527CODE prices'
          git pull --rebase
          git push
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.commit.outputs.changed == 'true'
        run: npm install

      - name: Build site with latest 9527 data
        if: steps.commit.outputs.changed == 'true'
        run: npm run build

      - name: Configure Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: needs.sync.outputs.changed == 'true'
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy latest pricing
        id: deployment
        uses: actions/deploy-pages@v4
