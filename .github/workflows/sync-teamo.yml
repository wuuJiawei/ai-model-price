name: sync-teamo-prices

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-teamo-prices
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch TeamoRouter pricing
        run: node scripts/sync-teamo.mjs

      - name: Validate data
        run: node scripts/validate.mjs

      - name: Commit price changes
        shell: bash
        run: |
          if git diff --quiet -- data/providers/teamo.json; then
            echo 'No TeamoRouter price changes.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/providers/teamo.json
          git commit -m 'chore(data): sync TeamoRouter prices'
          git push
