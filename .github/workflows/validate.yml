name: validate-data

on:
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'site/**'
      - 'package.json'
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
