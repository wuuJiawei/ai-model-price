name: validate-data

on:
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'src/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package.json'
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
